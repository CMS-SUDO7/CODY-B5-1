const transcripts = {"Q01": "Q01 | 기본 조회 | 판매 가능한 5,000원 이상 메뉴를 가격이 낮은 순서로 찾는다.\n2026-10-29 | SQLite CLI 3.43.2\n01_schema -> 02_seed -> Q01-Q15 / one transaction\n\nSELECT menu_id, menu_name, price_won\nFROM menu\nWHERE is_available = 1 AND price_won >= 5000\nORDER BY price_won ASC, menu_id ASC;\nmenu_id  menu_name  price_won\n-------  ---------  ---------\n3        바닐라라테      5000     \n5        콜드브루       5000     \n7        레몬차        5000     \n8        초코케이크      6500     \n9        치즈케이크      6500     \n", "Q02": "Q02 | 기본 조회 | 이름에 라테가 들어간 메뉴를 검색한다.\n2026-10-29 | SQLite CLI 3.43.2\n01_schema -> 02_seed -> Q01-Q15 / one transaction\n\nSELECT menu_id, menu_name, price_won\nFROM menu\nWHERE menu_name LIKE '%라테%'\nORDER BY menu_id ASC;\nmenu_id  menu_name  price_won\n-------  ---------  ---------\n2        카페라테       4500     \n3        바닐라라테      5000     \n", "Q03": "Q03 | 기본 조회 | 2026년 10월 주문 중 가장 최근 주문 5건을 찾는다.\n2026-10-29 | SQLite CLI 3.43.2\n01_schema -> 02_seed -> Q01-Q15 / one transaction\n\nSELECT order_id, customer_id, ordered_at, status\nFROM cafe_order\nWHERE ordered_at >= '2026-10-01 00:00:00'\n  AND ordered_at \u003c '2026-11-01 00:00:00'\nORDER BY ordered_at DESC, order_id DESC\nLIMIT 5;\norder_id  customer_id  ordered_at           status   \n--------  -----------  -------------------  ---------\n14        6            2026-10-13 15:30:00  cancelled\n13        5            2026-10-12 14:30:00  pending  \n12        4            2026-10-11 13:30:00  cancelled\n11        3            2026-10-10 11:30:00  paid     \n10        2            2026-10-09 10:30:00  paid     \n", "Q04": "Q04 | 기본 조회 | 결제 대기 또는 취소 상태인 주문을 찾는다.\n2026-10-29 | SQLite CLI 3.43.2\n01_schema -> 02_seed -> Q01-Q15 / one transaction\n\nSELECT order_id, customer_id, status\nFROM cafe_order\nWHERE status IN ('pending', 'cancelled')\nORDER BY order_id ASC;\norder_id  customer_id  status   \n--------  -----------  ---------\n12        4            cancelled\n13        5            pending  \n14        6            cancelled\n", "Q05": "Q05 | 조인 | 각 주문에 주문한 고객 이름을 붙인다. INNER JOIN 1.\n2026-10-29 | SQLite CLI 3.43.2\n01_schema -> 02_seed -> Q01-Q15 / one transaction\n\nSELECT o.order_id, c.customer_name, o.status\nFROM cafe_order AS o\nINNER JOIN customer AS c ON c.customer_id = o.customer_id\nORDER BY o.order_id ASC;\norder_id  customer_name  status   \n--------  -------------  ---------\n1         김민수            paid     \n2         이서연            paid     \n3         박지훈            paid     \n4         김민수            paid     \n5         최유진            paid     \n6         정하늘            paid     \n7         강도윤            paid     \n8         윤수빈            paid     \n9         장현우            paid     \n10        이서연            paid     \n11        박지훈            paid     \n12        최유진            cancelled\n13        정하늘            pending  \n14        강도윤            cancelled\n", "Q06": "Q06 | 조인 | 상세에 메뉴 이름과 당시 단가·소계를 붙인다. INNER JOIN 2.\n2026-10-29 | SQLite CLI 3.43.2\n01_schema -> 02_seed -> Q01-Q15 / one transaction\n\nSELECT i.order_item_id, m.menu_name, i.quantity,\n       i.unit_price_won, i.quantity * i.unit_price_won AS subtotal_won\nFROM order_item AS i\nINNER JOIN menu AS m ON m.menu_id = i.menu_id\nORDER BY i.order_item_id ASC;\norder_item_id  menu_name  quantity  unit_price_won  subtotal_won\n-------------  ---------  --------  --------------  ------------\n1              아메리카노      2         4000            8000        \n2              초코케이크      1         6500            6500        \n3              카페라테       1         4500            4500        \n4              버터쿠키       2         2500            5000        \n5              바닐라라테      2         5000            10000       \n6              치즈케이크      1         6500            6500        \n7              콜드브루       1         5000            5000        \n8              버터쿠키       1         2500            2500        \n9              얼그레이       1         4500            4500        \n10             초코케이크      1         6500            6500        \n11             레몬차        2         5000            10000       \n12             치즈케이크      1         6500            6500        \n13             카푸치노       1         4500            4500        \n14             버터쿠키       2         2500            5000        \n15             아메리카노      1         4000            4000        \n16             초코케이크      1         6500            6500        \n17             카페라테       2         4500            9000        \n18             치즈케이크      1         6500            6500        \n19             콜드브루       2         5000            10000       \n20             버터쿠키       1         2500            2500        \n21             바닐라라테      1         5000            5000        \n22             얼그레이       1         4500            4500        \n23             레몬차        1         5000            5000        \n", "Q07": "Q07 | 조인 | 주문이 없는 고객까지 포함해 고객과 주문을 확인한다. LEFT JOIN.\n2026-10-29 | SQLite CLI 3.43.2\n01_schema -> 02_seed -> Q01-Q15 / one transaction\n\nSELECT c.customer_id, c.customer_name, o.order_id, o.status\nFROM customer AS c\nLEFT JOIN cafe_order AS o ON o.customer_id = c.customer_id\nORDER BY c.customer_id ASC, o.order_id ASC;\ncustomer_id  customer_name  order_id  status   \n-----------  -------------  --------  ---------\n1            김민수            1         paid     \n1            김민수            4         paid     \n2            이서연            2         paid     \n2            이서연            10        paid     \n3            박지훈            3         paid     \n3            박지훈            11        paid     \n4            최유진            5         paid     \n4            최유진            12        cancelled\n5            정하늘            6         paid     \n5            정하늘            13        pending  \n6            강도윤            7         paid     \n6            강도윤            14        cancelled\n7            윤수빈            8         paid     \n8            장현우            9         paid     \n9            임지아            NULL      NULL     \n10           한시우            NULL      NULL     \n", "Q08": "Q08 | 조인 | 1번 고객의 결제 완료 주문에 담긴 메뉴와 수량을 확인한다.\n2026-10-29 | SQLite CLI 3.43.2\n01_schema -> 02_seed -> Q01-Q15 / one transaction\n\nSELECT c.customer_name, o.order_id, m.menu_name, i.quantity\nFROM customer AS c\nINNER JOIN cafe_order AS o ON o.customer_id = c.customer_id\nINNER JOIN order_item AS i ON i.order_id = o.order_id\nINNER JOIN menu AS m ON m.menu_id = i.menu_id\nWHERE c.customer_id = 1 AND o.status = 'paid'\nORDER BY o.order_id ASC, i.order_item_id ASC;\ncustomer_name  order_id  menu_name  quantity\n-------------  --------  ---------  --------\n김민수            1         아메리카노      2       \n김민수            1         초코케이크      1       \n김민수            4         콜드브루       1       \n김민수            4         버터쿠키       1       \n", "Q09": "Q09 | 집계 | 상태별 주문 건수를 센다. COUNT + GROUP BY.\n2026-10-29 | SQLite CLI 3.43.2\n01_schema -> 02_seed -> Q01-Q15 / one transaction\n\nSELECT status, COUNT(*) AS order_count\nFROM cafe_order\nGROUP BY status\nORDER BY status ASC;\nstatus     order_count\n---------  -----------\ncancelled  2          \npaid       11         \npending    1          \n", "Q10": "Q10 | 집계 | 결제 완료 주문의 고객별 구매액을 많은 순서로 정렬한다. SUM + GROUP BY.\n2026-10-29 | SQLite CLI 3.43.2\n01_schema -> 02_seed -> Q01-Q15 / one transaction\n\nSELECT c.customer_id, c.customer_name,\n       SUM(i.quantity * i.unit_price_won) AS total_paid_won\nFROM customer AS c\nINNER JOIN cafe_order AS o ON o.customer_id = c.customer_id\nINNER JOIN order_item AS i ON i.order_id = o.order_id\nWHERE o.status = 'paid'\nGROUP BY c.customer_id, c.customer_name\nORDER BY total_paid_won DESC, c.customer_id ASC;\ncustomer_id  customer_name  total_paid_won\n-----------  -------------  --------------\n1            김민수            22000         \n2            이서연            22000         \n3            박지훈            21500         \n5            정하늘            16500         \n8            장현우            15500         \n4            최유진            11000         \n7            윤수빈            10500         \n6            강도윤            9500          \n", "Q11": "Q11 | 집계 | 판매 가능한 메뉴의 분류별 평균 가격을 구한다. AVG + GROUP BY.\n2026-10-29 | SQLite CLI 3.43.2\n01_schema -> 02_seed -> Q01-Q15 / one transaction\n\nSELECT category, ROUND(AVG(price_won), 2) AS average_price_won\nFROM menu\nWHERE is_available = 1\nGROUP BY category\nORDER BY category ASC;\ncategory  average_price_won\n--------  -----------------\ncoffee    4600.0           \ndessert   6500.0           \ntea       4750.0           \n", "Q12": "Q12 | 서브쿼리 | 주문 기록이 한 번도 없는 고객을 찾는다. NOT EXISTS.\n2026-10-29 | SQLite CLI 3.43.2\n01_schema -> 02_seed -> Q01-Q15 / one transaction\n\nSELECT c.customer_id, c.customer_name\nFROM customer AS c\nWHERE NOT EXISTS (\n    SELECT 1\n    FROM cafe_order AS o\n    WHERE o.customer_id = c.customer_id\n)\nORDER BY c.customer_id ASC;\ncustomer_id  customer_name\n-----------  -------------\n9            임지아          \n10           한시우          \n", "Q13": "Q13 | 수정 | 13번 주문이 결제 대기일 때만 결제 완료로 바꾼다.\n2026-10-29 | SQLite CLI 3.43.2\n01_schema -> 02_seed -> Q01-Q15 / one transaction\n\nBEFORE\nSELECT order_id, status FROM cafe_order WHERE order_id = 13;\norder_id  status \n--------  -------\n13        pending\nUPDATE cafe_order\nSET status = 'paid'\nWHERE order_id = 13 AND status = 'pending';\nSELECT changes() AS changed_rows;\nchanged_rows\n------------\n1           \nAFTER\nSELECT order_id, status FROM cafe_order WHERE order_id = 13;\norder_id  status\n--------  ------\n13        paid  \n", "Q14": "Q14 | 삭제 | 상세가 없는 14번 취소 주문을 삭제한다.\n2026-10-29 | SQLite CLI 3.43.2\n01_schema -> 02_seed -> Q01-Q15 / one transaction\n\nBEFORE\nSELECT order_id, status FROM cafe_order WHERE order_id = 14;\norder_id  status   \n--------  ---------\n14        cancelled\nSELECT COUNT(*) AS order_count FROM cafe_order;\norder_count\n-----------\n14         \nDELETE FROM cafe_order\nWHERE order_id = 14 AND status = 'cancelled';\nSELECT changes() AS changed_rows;\nchanged_rows\n------------\n1           \nAFTER\nSELECT COUNT(*) AS remaining_order_14 FROM cafe_order WHERE order_id = 14;\nremaining_order_14\n------------------\n0                 \nSELECT COUNT(*) AS order_count FROM cafe_order;\norder_count\n-----------\n13         \nSELECT COUNT(*) AS item_count FROM order_item;\nitem_count\n----------\n23        \n", "Q15": "Q15 | 인덱스 | 최근 주문 검색의 시각 범위와 정렬을 지원하는 인덱스를 만든다.\n2026-10-29 | SQLite CLI 3.43.2\n01_schema -> 02_seed -> Q01-Q15 / one transaction\n\nBEFORE: query plan for Q03\nEXPLAIN QUERY PLAN SELECT order_id, customer_id, ordered_at, status\nFROM cafe_order\nWHERE ordered_at >= '2026-10-01 00:00:00'\n  AND ordered_at \u003c '2026-11-01 00:00:00'\nORDER BY ordered_at DESC, order_id DESC\nLIMIT 5;\nQUERY PLAN\n|--SCAN cafe_order\n`--USE TEMP B-TREE FOR ORDER BY\nCREATE INDEX IF NOT EXISTS idx_cafe_order_recent\nON cafe_order (ordered_at DESC, order_id DESC);\nAFTER: query plan for Q03\nEXPLAIN QUERY PLAN SELECT order_id, customer_id, ordered_at, status\nFROM cafe_order\nWHERE ordered_at >= '2026-10-01 00:00:00'\n  AND ordered_at \u003c '2026-11-01 00:00:00'\nORDER BY ordered_at DESC, order_id DESC\nLIMIT 5;\nQUERY PLAN\n`--SEARCH cafe_order USING INDEX idx_cafe_order_recent (ordered_at>? AND ordered_at\u003c?)\n"};
